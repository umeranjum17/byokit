plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.umeranjum17.byokit'
version = '0.2.2'

android {
  namespace "io.github.umeranjum17.byokit.overlay"
  defaultConfig {
    minSdkVersion 26
    versionCode 3
    versionName "0.2.2"
  }
  // The JVM tests subclass framework types (AccessibilityNodeInfo, AccessibilityService) over android.jar's stubs.
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // PanelActivity is a ReactActivity; the app's React Native Gradle plugin picks the version.
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
