# Repo config for no-mistakes validation.
# test.instructions is read from the trusted default branch once merged.
test:
  instructions: |
    Run only the tests of the packages and paths this change touches, plus one user
    journey below; CI runs the full suite on every pull request, so never run the
    whole `npm test` here. Name the changed parts' test files or globs, e.g.
    `sh scripts/test.sh 'packages/<kit>/test/*.test.ts'`; a change to a shared build
    input (root package.json, lockfile, tsconfig, scripts/test.sh) runs the tests of
    the kits it can break. Run tests only through `sh scripts/test.sh` — never bare
    `node --test` and never `--experimental-test-coverage` or any other coverage
    flag; run a heavy suite through the host memory gate when one exists.
    Prove changes against the real built SDK through done-done, not summaries and
    never by hand: `done-done verify <journey> --foreground --outcome "<what a user
    can now do>"` with the one journey the change touches (`.done-done.yaml`: build,
    gate, ci-gate-event, core, upgrade), or `done-done verify --outcome "<claim>"
    --feature <name>` for a user-visible change, driving the matching feature in the
    repo's verify skill. `done-done doctor` must pass before any proof run.
    A journey run builds the SDK from scratch (npm ci in a fresh worktree, then
    npm run build), doctors the built artifacts and drives the journey, keeping
    the command, stdout, stderr and exit code in the run's evidence folder
    (DONE_DONE_EVIDENCE_ROOT); a feature run drives the matching feature file
    and saves its captures there too.
    Include the feature's error or missing case; declare surfaces unavailable on
    this host (browser, React Native, Android, real providers) instead of
    substituting a different path.
    A user-visible change is proved by the feature's own capture, never by hand:
    `done-done verify --feature pwa-review-evidence --outcome "<claim>"` runs the
    maintained review-evidence capture, and the run names the files it wrote into
    its evidence folder — every changed screen before and after, in every theme
    (dark and light) and form factor (phone and desktop width) the app has, plus
    one motion recording per changed interaction, from the real running app. Where
    the capture cannot reach one of those, extend the capture in this change or
    file a follow-up naming the exact gap; a skip is only allowed with its reason
    in manifest.json.
