# Repo config for no-mistakes validation.
# test.instructions is read from the trusted default branch once merged.
test:
  instructions: |
    Prove changes against the real built SDK, not summaries.
    Read .agents/skills/verify-byokit/SKILL.md first, then the matching file in
    .agents/skills/verify-byokit/features/ (index: features/README.md).
    Launch (npm ci in a fresh worktree, then npm run build), run the doctor from
    SKILL.md, drive the feature whose journey the change touches with its scratch
    consumer, and capture command, stdout, stderr and exit code under
    .verify-artifacts/<feature>/ (gitignored, survives cleanup).
    Include the feature's error or missing case; declare surfaces unavailable on
    this host (browser, React Native, Android, real providers) instead of
    substituting a different path.
    A user-visible change is proved by the skill's own capture, never by hand:
    run `node .agents/skills/verify-byokit/capture/review-evidence.ts --base
    origin/main --slug <slug>` (features/pwa-review-evidence.md), and name the
    files it wrote under .verify-artifacts/review/<slug>/ — every changed screen
    before and after, in every theme (dark and light) and form factor (phone and
    desktop width) the app has, plus one motion recording per changed interaction,
    from the real running app. Where the capture cannot reach one of those,
    extend the capture in this change or file a follow-up naming the exact gap; a
    skip is only allowed with its reason in manifest.json.
