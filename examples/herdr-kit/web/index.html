<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1b1a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Agents</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --ink: #1b1b1a; --soft: #5f5d58; --line: #e3e0da; --accent: #1f5eff; --on-accent: #fff;
    --ok: #177a3e; --ok-bg: #e3f4e8; --busy: #1f5eff; --busy-bg: #e5ecff; --ask: #8a4b00; --ask-bg: #fff0d6; --bad: #b3261e;
    --screen: #141414; --screen-ink: #e8e6e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --card: #1c1c1b; --ink: #f1efea; --soft: #a9a59d; --line: #2e2d2b; --accent: #7aa2ff; --on-accent: #0b0b0b;
      --ok: #7ad69a; --ok-bg: #16301f; --busy: #9db8ff; --busy-bg: #1a2442; --ask: #ffc56b; --ask-bg: #3a2a10; --bad: #ff8a80;
      --screen: #0a0a0a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 34rem; margin: 0 auto; padding: max(1rem, env(safe-area-inset-top)) 1rem max(2rem, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .25rem; }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); margin: 1.6rem 0 .5rem; }
  p { margin: .3rem 0; }
  .status { color: var(--soft); font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; }
  label { display: block; font-weight: 600; margin: .8rem 0 .35rem; }
  input, select, textarea { font: inherit; font-size: 17px; width: 100%; padding: .75rem .8rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  textarea { resize: vertical; min-height: 5.5rem; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; min-height: 48px; padding: .7rem 1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; width: 100%; margin-top: .9rem; }
  button:disabled { opacity: .5; cursor: default; }
  .quiet { background: none; border: 0; color: var(--soft); font-weight: 500; text-decoration: underline; min-height: 44px; padding: 0; }
  .words { font-size: 1.7rem; font-weight: 700; text-align: center; letter-spacing: .02em; margin: 1rem 0; }
  .error { color: var(--bad); }
  ul { list-style: none; margin: 0; padding: 0; }
  .agent { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: .75rem; text-align: left; margin-bottom: .5rem; }
  .agent .id { display: flex; flex-direction: column; min-width: 0; }
  .agent .sub { color: var(--soft); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { flex: none; font-size: .8rem; font-weight: 600; padding: .25rem .6rem; border-radius: 999px; background: var(--line); color: var(--soft); }
  .pill.idle, .pill.done { background: var(--ok-bg); color: var(--ok); }
  .pill.working, .pill.starting { background: var(--busy-bg); color: var(--busy); }
  .pill.blocked { background: var(--ask-bg); color: var(--ask); }
  .question { border-color: var(--ask); margin-bottom: .75rem; }
  .question h3 { font-size: 1rem; margin: 0 0 .25rem; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-top: .75rem; }
  .menu { position: relative; }
  .menu summary { cursor: pointer; font-weight: 500; color: var(--soft); text-decoration: underline; min-height: 44px; display: flex; align-items: center; list-style: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu .sheet { position: absolute; right: 0; z-index: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .5rem; box-shadow: 0 8px 24px rgb(0 0 0 / .12); }
  .menu .sheet button { border: 0; white-space: nowrap; }
  .keys button { padding: .6rem .2rem; }
  pre { margin: .6rem 0 0; padding: .8rem; border-radius: 10px; background: var(--screen); color: var(--screen-ink); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 18rem; overflow-y: auto; }
  pre:empty { display: none; }

  .empty { color: var(--soft); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { button { transition: background-color .15s, border-color .15s; } }
</style>
<main>
  <header>
    <h1>Agents</h1>
    <details id="menu" class="menu" hidden>
      <summary>Options</summary>
      <div class="sheet"><button id="forget" class="quiet">Forget this computer</button></div>
    </details>
  </header>
  <p id="link" class="status" role="status"></p>

  <section id="pair" hidden aria-labelledby="pair-title">
    <h2 id="pair-heading">Pair this phone</h2>
    <div class="card">
      <p id="pair-title"></p>
      <p id="pair-words" class="words" hidden></p>
      <form id="pair-form">
        <label for="pair-input">Code from the computer</label>
        <input id="pair-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD-EFGH-JKLM">
        <button class="primary" id="pair-go">Pair</button>
      </form>
      <p id="pair-error" class="error" role="alert"></p>
    </div>
  </section>

  <section id="home" hidden>
    <section id="questions" hidden aria-labelledby="questions-heading">
      <h2 id="questions-heading">Questions for you</h2>
      <ul id="blocked" aria-live="polite"></ul>
    </section>

    <section aria-labelledby="agents-heading">
      <h2 id="agents-heading">Agents</h2>
      <div id="tree"></div>
    </section>

    <section id="agent" hidden aria-labelledby="agent-name">
      <h2>Talk to it</h2>
      <div class="card">
        <header><h3 id="agent-name" style="margin:0"></h3><span id="agent-status" class="pill"></span></header>
        <pre id="screen" tabindex="0" aria-label="What the agent shows"></pre>
        <form id="prompt-form">
          <label for="prompt">Message</label>
          <textarea id="prompt" rows="3" enterkeyhint="send"></textarea>
          <button class="primary" id="send">Send</button>
        </form>
        <p id="receipt" class="status" role="status"></p>
      </div>
    </section>

    <section class="card" style="margin-top:1.4rem" aria-labelledby="start-heading">
      <h2 id="start-heading" style="margin:0 0 .5rem">Start agent</h2>
      <form id="start-form">
        <label for="kind">Agent</label>
        <select id="kind"></select>
        <label for="folder">Folder on the computer</label>
        <input id="folder" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="primary" id="start-go">Start agent</button>
      </form>
      <p id="start-error" class="error" role="alert"></p>
    </section>
  </section>
</main>
<script type="module" src="app.js"></script>
</html>
