<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYOKit voice proof</title>
<body><main><h1>Voice demonstration</h1><p>This live demo uses your ChatGPT subscription. It keeps sign-in only in memory and stops after forty seconds.</p>
<p>Use only the demo words: “Hello from BYOKit.” No audio is recorded. Proof retains counts and connection facts.</p>
<button id="sign-in">Sign in with ChatGPT</button><p id="code"></p><a id="authorize" hidden target="_blank" rel="noopener">Approve sign-in</a>
<p><button id="start">Start voice</button> <button id="interrupt">Interrupt</button> <button id="stop">Stop</button></p>
<output id="status">Ready to sign in</output><audio id="audio" autoplay></audio></main><script type="module" src="/voice.js"></script></body></html>
