# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "byokit"
skill: .agents/skills/done-done-verify-byokit
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode

# Standing checks as done-done primitives, each proving the same bar: launch,
# doctor, drive with an error case, and captured evidence. Each journey runs
# from the repo root with DONE_DONE_EVIDENCE_ROOT (this run's own folder) set
# and writes its proof files there. CI and the merge gate call these journeys.
# A user-visible change is proved feature-first instead: done-done verify
# --outcome "<claim>" --feature <name> drives the matching feature file in
# the repo's verify skill and saves its captures into the run's evidence
# folder.
journeys:
  accounts-cli-targeted-signin:
    command: node .agents/skills/done-done-verify-byokit/capture/accounts-cli-targeted-signin.mjs
    timeout: 2m
  openclaw-native-binding:
    command: node .agents/skills/done-done-verify-byokit/capture/openclaw-native-binding.mjs
    timeout: 2m
  accounts-rn-models:
    command: node --conditions=react-native .agents/skills/done-done-verify-byokit/capture/accounts-rn-models.mjs > "$DONE_DONE_EVIDENCE_ROOT/rn-models.log" 2>&1
  pi-model-admission:
    command: node .agents/skills/done-done-verify-byokit/capture/pi-model-admission.mjs
    timeout: 5m
  build:
    command: npm run build > "$DONE_DONE_EVIDENCE_ROOT/build.log" 2>&1 && echo "npm run build exited 0 and every package built (run $DONE_DONE_RUN_ID)" >> "$DONE_DONE_EVIDENCE_ROOT/build.log" && node --input-type=module -e "import { createRequire } from 'node:module'; const require = createRequire(process.cwd() + '/'); const pkg = require('./packages/accounts/package.json'); const acc = await import('@byokit/accounts'); const testing = await import('@byokit/accounts/testing'); if (!acc.Accounts || !acc.portable || typeof testing.mockOpenAI !== 'function') throw new Error('built entry incomplete'); console.log('doctor ok:', pkg.name, pkg.version, 'resolves', require.resolve('@byokit/accounts'));" > "$DONE_DONE_EVIDENCE_ROOT/doctor.log" 2>&1
  gate:
    command: |
      { echo "gate checked at $(date -u +%Y-%m-%dT%H:%M:%SZ) on head $(git rev-parse HEAD)"; done-done gate; } > "$DONE_DONE_EVIDENCE_ROOT/gate.log" 2>&1
      { echo "CI check runs for this pull request, read at $(date -u +%Y-%m-%dT%H:%M:%SZ):"; gh-axi pr checks 800 2>&1 | grep -E '^(summary|  done-done,)'; } > "$DONE_DONE_EVIDENCE_ROOT/ci-checks.log" 2>&1
  # The CI gate's event rule: the done-done job judges a receipt against the commit CI
  # checked out, so it runs on a pull request only, and the ci-ok aggregate passes a job
  # skipped by design. One capture holds the workflow's own rule, the gate's ancestor
  # failure from the failing push to main run's job log, and what GitHub Actions really did
  # on the real runs. See features/ci-done-done-gate-event.md.
  ci-gate-event:
    command: |
      {
        echo "CI gate event rule, read at $(date -u +%Y-%m-%dT%H:%M:%SZ) on head $(git rev-parse HEAD)"
        echo
        echo "What this capture shows, in order:"
        echo "  a. the bug: the push to main run 39548414209 (before this change) failed at the done-done gate;"
        echo "  b. the fix: the done-done job's condition now runs it on a pull request only;"
        echo "  c. that condition's false side is real: in this same workflow a step guarded by"
        echo "     github.event_name == 'pull_request' ran in the pull request run and did not run in the push"
        echo "     to main run, while the step guarded by github.event_name == 'push' did the opposite;"
        echo "  d. the aggregate: a job skipped by design passes ci-ok, so the push to main run is green;"
        echo "  e. the release: a green push to main CI run triggers the Release workflow."
        echo
        echo "1. The bug, in the push to main run's own job log (run 39548414209, event push, before this change; this is the run the fix removes):"
        gh-axi run view 39548414209 --job 119051848588 --log 2>&1 | grep -o 'FAIL: receipt head[^\\]*'
        gh-axi run view 39548414209 2>&1 | grep -E 'done-done,completed|ci-ok,completed'
        echo
        echo "2. The fix: the job that judges the receipt (.github/workflows/ci.yml, job done-done):"
        awk '/^  done-done:$/{p=1} p&&/^  [a-z0-9-]+:$/&&!/^  done-done:$/{exit} p' .github/workflows/ci.yml
        echo
        echo "3. The same event condition, evaluated by GitHub on real runs of this workflow. The check job"
        echo "   guards its two release lint steps by the event (.github/workflows/ci.yml, job check):"
        grep -A 2 'name: Release lint' .github/workflows/ci.yml
        echo "   the release lint steps that ran, read from each run's check job log:"
        echo -n "   run 39548414209 (push to main): "
        gh-axi run view 39548414209 --job 119051848705 --log 2>&1 | grep -oE 'Release lint \((main push|PR)\)' | sort -u | tr '\n' ' '
        echo
        echo -n "   run 39549914720 (pull request): "
        gh-axi run view 39549914720 --job 119056562572 --log 2>&1 | grep -oE 'Release lint \((main push|PR)\)' | sort -u | tr '\n' ' '
        echo
        echo "   So on a push to main github.event_name == 'pull_request' is false, and the done-done job is skipped."
        echo
        echo "4. The aggregate that decides whether CI is green (.github/workflows/ci.yml, job ci-ok):"
        awk '/^  # The one required check/{p=1} p' .github/workflows/ci.yml
        echo "   and what it did on a real run where 15 jobs were skipped by their own area (run 39549914720, a pull request):"
        gh-axi run view 39549914720 2>&1 | awk '/,skipped$/{n++} END{print "   jobs skipped by their own area: " n}'
        gh-axi run view 39549914720 2>&1 | grep -E 'done-done,completed|ci-ok,completed'
        echo "   A skipped job is not a failure, so on a push to main, where the done-done job is skipped, ci-ok is green."
        echo
        echo "5. What publishes the release (.github/workflows/release.yml, job publish):"
        awk '/^  publish:$/{p=1} p&&/runs-on:/{print; exit} p' .github/workflows/release.yml
      } > "$DONE_DONE_EVIDENCE_ROOT/ci-gate-event.log" 2>&1
  # The core user journey and the release path, in .done-done.yaml: a consumer app
  # links an account and gets an answer through the shipped package, and the same
  # app upgrades that package in place over the previous shipped version.
  core:
    command: node .agents/skills/done-done-verify-byokit/capture/core-journey.mjs
    core: true
    timeout: 20m
  upgrade:
    command: node .agents/skills/done-done-verify-byokit/capture/upgrade-journey.mjs
    upgrade: true
    timeout: 20m
