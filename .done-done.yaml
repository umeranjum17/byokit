# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "byokit"
skill: .agents/skills/done-done-verify-byokit
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode

# Standing checks as done-done primitives, each proving the same bar: launch,
# doctor, drive with an error case, and captured evidence. Each journey runs
# from the repo root with DONE_DONE_EVIDENCE_ROOT (this run's own folder) set
# and writes its proof files there. CI and the merge gate call these journeys.
# A user-visible change is proved feature-first instead: done-done verify
# --outcome "<claim>" --feature <name> drives the matching feature file in
# the repo's verify skill and saves its captures into the run's evidence
# folder.
journeys:
  build:
    command: npm run build > "$DONE_DONE_EVIDENCE_ROOT/build.log" 2>&1 && echo "npm run build exited 0 and every package built" >> "$DONE_DONE_EVIDENCE_ROOT/build.log" && node --input-type=module -e "import { createRequire } from 'node:module'; const require = createRequire(process.cwd() + '/'); const pkg = require('./packages/accounts/package.json'); const acc = await import('@byokit/accounts'); const testing = await import('@byokit/accounts/testing'); if (!acc.Accounts || !acc.portable || typeof testing.mockOpenAI !== 'function') throw new Error('built entry incomplete'); console.log('doctor ok:', pkg.name, pkg.version, 'resolves', require.resolve('@byokit/accounts'));" > "$DONE_DONE_EVIDENCE_ROOT/doctor.log" 2>&1
  node-tests:
    command: npm test > "$DONE_DONE_EVIDENCE_ROOT/node-tests.log" 2>&1
    timeout: 30m
  browser-tests:
    command: npm run test:browser > "$DONE_DONE_EVIDENCE_ROOT/browser-tests.log" 2>&1
    timeout: 30m
