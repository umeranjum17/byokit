# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "byokit"
skill: .agents/skills/done-done-verify-byokit
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode

# Standing checks as done-done primitives, each proving the same bar: launch,
# doctor, drive with an error case, and captured evidence. Each journey runs
# from the repo root with DONE_DONE_EVIDENCE_ROOT (this run's own folder) set
# and writes its proof files there. CI and the merge gate call these journeys.
# A user-visible change is proved feature-first instead: done-done verify
# --outcome "<claim>" --feature <name> drives the matching feature file in
# the repo's verify skill and saves its captures into the run's evidence
# folder.
journeys:
  build:
    command: npm run build > "$DONE_DONE_EVIDENCE_ROOT/build.log" 2>&1 && echo "npm run build exited 0 and every package built (run $DONE_DONE_RUN_ID)" >> "$DONE_DONE_EVIDENCE_ROOT/build.log" && node --input-type=module -e "import { createRequire } from 'node:module'; const require = createRequire(process.cwd() + '/'); const pkg = require('./packages/accounts/package.json'); const acc = await import('@byokit/accounts'); const testing = await import('@byokit/accounts/testing'); if (!acc.Accounts || !acc.portable || typeof testing.mockOpenAI !== 'function') throw new Error('built entry incomplete'); console.log('doctor ok:', pkg.name, pkg.version, 'resolves', require.resolve('@byokit/accounts'));" > "$DONE_DONE_EVIDENCE_ROOT/doctor.log" 2>&1
  gate:
    command: |
      { echo "gate checked at $(date -u +%Y-%m-%dT%H:%M:%SZ) on head $(git rev-parse HEAD)"; done-done gate; } > "$DONE_DONE_EVIDENCE_ROOT/gate.log" 2>&1
      { echo "CI check runs for this pull request, read at $(date -u +%Y-%m-%dT%H:%M:%SZ):"; gh-axi pr checks 800 2>&1 | grep -E '^(summary|  done-done,)'; } > "$DONE_DONE_EVIDENCE_ROOT/ci-checks.log" 2>&1
  # The CI gate's event rule: the done-done job judges a receipt against the commit CI
  # checked out, so it runs on a pull request only, and the ci-ok aggregate passes a job
  # skipped by design. One capture holds the workflow's own rule, the gate's ancestor
  # failure from the failing push to main run's job log, and what GitHub Actions really did
  # on the real runs. See features/ci-done-done-gate-event.md.
  ci-gate-event:
    command: |
      {
        echo "CI gate event rule, read at $(date -u +%Y-%m-%dT%H:%M:%SZ) on head $(git rev-parse HEAD)"
        echo
        echo "1. The job that judges the receipt (.github/workflows/ci.yml, job done-done):"
        awk '/^  done-done:$/{p=1} p&&/^  [a-z0-9-]+:$/&&!/^  done-done:$/{exit} p' .github/workflows/ci.yml
        echo
        echo "2. The rule that gate follows, in the failing push to main run's own job log (run 39548414209, job done-done):"
        gh-axi run view 39548414209 --job 119051848588 --log 2>&1 | grep -o 'FAIL: receipt head[^\\]*'
        echo
        echo "3. The aggregate that decides whether CI is green (.github/workflows/ci.yml, job ci-ok):"
        awk '/^  # The one required check/{p=1} p' .github/workflows/ci.yml
        echo
        echo "4. What GitHub Actions really did, on real runs of this workflow:"
        echo "   run 39548414209 (push to main, before this change):"
        gh-axi run view 39548414209 2>&1 | grep -E 'done-done,completed|ci-ok,completed'
        echo "   run 39549914720 (pull request):"
        gh-axi run view 39549914720 2>&1 | awk '/,skipped$/{n++} END{print "   jobs skipped by their own area: " n}'
        gh-axi run view 39549914720 2>&1 | grep -E 'done-done,completed|ci-ok,completed'
        echo
        echo "5. What publishes the release (.github/workflows/release.yml, job publish):"
        awk '/^  publish:$/{p=1} p&&/runs-on:/{print; exit} p' .github/workflows/release.yml
      } > "$DONE_DONE_EVIDENCE_ROOT/ci-gate-event.log" 2>&1
  node-tests:
    command: npm test > "$DONE_DONE_EVIDENCE_ROOT/node-tests.log" 2>&1
    timeout: 30m
  browser-tests:
    command: npm run test:browser > "$DONE_DONE_EVIDENCE_ROOT/browser-tests.log" 2>&1
    timeout: 30m
