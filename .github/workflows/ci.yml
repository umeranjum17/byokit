name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  TMPDIR: /tmp

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: node scripts/readme-check.ts
      - name: Isolated tests (including hosted MCP HTTP round trip)
        run: |
          export TMPDIR=$(mktemp -d /tmp/bk-XXXX)
          trap 'node -e '\''require("node:fs").rmSync(process.env.TMPDIR, { recursive: true, force: true })'\''' EXIT
          npm test # throwaway HOME, mocks only: no account, no network, no model
      - name: M6 preparation dry run (fake provider and fake SSH only)
        run: node scripts/machine-proof/run.ts --dry-run --output .lab/m6-dry.json
      - name: Packed kit consumers
        run: |
          export TMPDIR=$(mktemp -d /tmp/bk-XXXX)
          trap 'node -e '\''require("node:fs").rmSync(process.env.TMPDIR, { recursive: true, force: true })'\''' EXIT
          npm run smoke:pack
      - name: Release lint (PR)
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: origin/${{ github.base_ref }}
        run: npm run release -- lint --base "$RELEASE_BASE"
      - name: Release lint (main push)
        if: github.event_name == 'push'
        env:
          RELEASE_BASE: ${{ github.event.before }}
        run: npm run release -- lint --base "$RELEASE_BASE" --direct

  # Linux byte parity only: this does not compile the Apple Security path or run an iOS extension.
  seal-swift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: swift@sha256:2d1c71154f1f9c8ca712997f49a7b42366978ae7d28fa9a76ea3672d62dbd251 # official 5.10.1-jammy, linux/amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --jobs 2
        working-directory: packages/seal

  # Disposable Secret Service session: no user's desktop/keyring and no outbound network in tests.
  secrets-keyring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Native Secret Service round trip and rotation
        run: sh scripts/test-keyring.sh

  # Real browsers (headless Chromium): the PWA example's sign-in against a stand-in OpenAI, and the Herdr and OpenClaw
  # kit examples.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # The Herdr kit example as someone installs it (packed packages) against the kit's fake Herdr, on a phone-sized page.
      - run: sh scripts/test.sh examples/herdr-kit/e2e.test.ts
      # The OpenClaw kit example the same way, against the kit's fake Gateway.
      - run: sh scripts/test.sh examples/openclaw-kit/e2e.test.ts

  openclaw-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Hosted Ubuntu restricts unprivileged user namespaces, which Chromium's sandbox needs; this runner is ephemeral.
      - run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: npm run test:engine
      # Exact candidate internal runtime closure; external registry pins, real old/new Gateways, no accounts/models.
      # Source qualification, not proof that public consumers adopted these candidate package versions.
      - run: |
          scratch=$(mktemp -d /tmp/oc.XXXX)
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/home" "$scratch/t"
          HOME="$scratch/home" TMPDIR="$scratch/t" npm run smoke:pack -- --openclaw-engine

  # @byokit/write against its exactly pinned npm engine, in process and through the engine bin.
  write-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:write-engine

  # A real screen recorder on a private X display; no owner's display or account.
  record-recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: sh scripts/test.sh packages/record/test/real/smoke.test.ts

  # React Native (Expo) on iOS and Android: the example typechecks and Metro builds both Hermes bundles from the kit's
  # react-native side. The emulator run is examples/expo/e2e-android.sh.
  react-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/expo/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: npm run typecheck
        working-directory: examples/expo
      - run: sh scripts/test.sh examples/expo/pairing.test.ts
      - run: node examples/expo/cold-accounts.ts
      - run: npx expo export --platform android --platform ios --output-dir dist
        working-directory: examples/expo

  # Frozen Kotlin mirror JVM tests, dictation, and real RN lazy microphone privacy on a disposable emulator.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: android/test.sh
      - run: npm ci --no-audit --no-fund
        working-directory: examples/realtime-android
      - name: Build real React Native microphone fixture
        run: npm run typecheck && CI=1 npx expo prebuild -p android --no-install && (cd android && CI=1 NODE_ENV=production ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon)
        working-directory: examples/realtime-android
      - name: Enable KVM for the disposable emulator
        run: sudo chmod 666 /dev/kvm
      - name: Dictation and lazy microphone consumers
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            ./android/gradlew -p examples/dictation-android --no-daemon connectedDebugAndroidTest
            ./examples/realtime-android/e2e-android.sh emulator-5554
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          include-hidden-files: true
          path: |
            android/byokit-android/build/reports/tests/
            examples/dictation-android/build/reports/androidTests/
            examples/dictation-android/build/outputs/androidTest-results/
            examples/realtime-android/.proof/

  # @byokit/overlay's Expo module: the example prebuilds with the kit's config plugin and assembles with its Kotlin,
  # then JVM tests, consent/point-marker proof and real Chromium WebView focus/insertion run on an emulator.
  overlay-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/expo/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Release bundling resolves the linked kit exports and their dependencies from the repo root.
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: CI=1 npx expo prebuild -p android --no-install && (cd android && ./gradlew assembleRelease :byokit-overlay:testDebugUnitTest)
        working-directory: examples/expo
        env:
          EXPO_PUBLIC_SCREEN_DEMO: '1'
          NODE_ENV: production
      - run: |
          sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: cd examples/expo/android && ./gradlew :byokit-overlay:connectedDebugAndroidTest :a11y-demo:connectedDebugAndroidTest -PreactNativeArchitectures=x86_64 && cd .. && ./e2e-screen-frame.sh emulator-5554 .screen-captures
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: byokit-screen-proof
          path: examples/expo/.screen-captures/*.png
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: overlay-webview-test-reports
          path: examples/expo/modules/a11y-demo/android/build/outputs/androidTest-results/

  share-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: npm ci --no-audit --no-fund
      - run: node scripts/share-expo-smoke.ts --android-only --build --out /tmp/bks-android
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: CI=1 npx expo prebuild -p android --no-install && (cd android && ./gradlew assembleDebug :byokit-share:testDebugUnitTest --no-daemon)
        working-directory: examples/expo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: share-android-receipts
          path: |
            /tmp/bks-android/*-command.*
            /tmp/bks-android/*receipts.json
            /tmp/bks-android/*javap
            /tmp/bks-android/result.json
            /tmp/bks-android/failure.txt
            /tmp/bks-android/app/node_modules/@byokit/share/android/build/test-results/

  share-ios-prebuild:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/share-expo-smoke.ts --ios-only --out /tmp/bks-ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: share-ios-prebuild-receipts
          path: |
            /tmp/bks-ios/*-command.*
            /tmp/bks-ios/*receipts.json
            /tmp/bks-ios/result.json
            /tmp/bks-ios/failure.txt
            /tmp/bks-ios/withwidgets.pbxproj

  # @byokit/statusbar's Expo module, in the overlay-android shape: the example prebuilds with the kit's config plugin and
  # assembles with its Kotlin, then StatusRules' JVM tests run. The emulator proof is recorded in the PR (BK-S1).
  statusbar-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/expo/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: npm ci --no-audit --no-fund
      - name: Packed plugin on Expo 55
        run: node scripts/statusbar-expo-smoke.ts
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: CI=1 npx expo prebuild -p android --no-install && (cd android && ./gradlew assembleDebug :byokit-statusbar:testDebugUnitTest)
        working-directory: examples/expo

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/audit.ts
      - run: node ../../scripts/audit.ts
        working-directory: examples/expo

  push-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/expo/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: CI=1 npx expo prebuild -p android --no-install && (cd android && ./gradlew assembleDebug :byokit-push:testDebugUnitTest)
        working-directory: examples/expo

  push-ios:
    runs-on: macos-26
    env:
      # Expo 57 requires Xcode 26.4+; match its supported SDK 57 build image's Xcode 26.6.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/expo/package-lock.json
      - run: swift test
        working-directory: packages/push/ios
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: CI=1 npx expo prebuild -p ios --no-install
        working-directory: examples/expo
      - run: pod install
        working-directory: examples/expo/ios
      - run: xcodebuild -workspace byokitexample.xcworkspace -scheme byokitexample -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: examples/expo/ios
