name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: node scripts/readme-check.ts
      - run: npm test # throwaway HOME, mocks only: no account, no network, no model
      - run: npm run smoke:pack
      - name: Release lint (PR)
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: origin/${{ github.base_ref }}
        run: npm run release -- lint --base "$RELEASE_BASE"
      - name: Release lint (main push)
        if: github.event_name == 'push'
        env:
          RELEASE_BASE: ${{ github.event.before }}
        run: npm run release -- lint --base "$RELEASE_BASE" --direct

  # Real browsers (headless Chromium): the PWA example's sign-in against a stand-in OpenAI, and the Herdr and OpenClaw
  # kit examples.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # The Herdr kit example as someone installs it (packed packages) against the kit's fake Herdr, on a phone-sized page.
      - run: sh scripts/test.sh examples/herdr-kit/e2e.test.ts
      # The OpenClaw kit example the same way, against the kit's fake Gateway.
      - run: sh scripts/test.sh examples/openclaw-kit/e2e.test.ts

  openclaw-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:engine

  # @byokit/write against the real engine (docs/capability-kits.md 9.2). ownvoice-engine is not on npm yet, so the
  # pin runs from its public source at the commit its committed schema came from; once published it becomes the exact
  # dependency and this checkout step goes.
  write-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: ownvoice-engine at faf2fc2
        run: |
          set -eu
          dir="$RUNNER_TEMP/ownvoice"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/umeranjum17/ownvoice.git faf2fc29a29b0d6c8c9f14d5fa822842747e6eda
          git -C "$dir" checkout -q FETCH_HEAD
          ln -s "$dir/packages/engine" node_modules/ownvoice-engine
      - run: npm run test:write-engine

  # React Native (Expo) on iOS and Android: the example typechecks and Metro builds both Hermes bundles from the kit's
  # react-native side. The emulator run is examples/expo/e2e-android.sh.
  react-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/expo/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: npm run typecheck
        working-directory: examples/expo
      - run: sh scripts/test.sh examples/expo/pairing.test.ts
      - run: npx expo export --platform android --platform ios --output-dir dist
        working-directory: examples/expo

  # byokit-android: JVM unit tests, including every case in fixtures/conformance, in a throwaway HOME. No device needed.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: android/test.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: android/byokit-android/build/reports/tests/

  # @byokit/overlay's Expo module: the example prebuilds with the kit's config plugin and assembles with its Kotlin,
  # then the module's JVM unit tests run. No device needed; the emulator proof is BK-O3's.
  overlay-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/expo/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: CI=1 npx expo prebuild -p android --no-install && (cd android && ./gradlew assembleDebug :byokit-overlay:testDebugUnitTest)
        working-directory: examples/expo

  # @byokit/statusbar's Expo module, in the overlay-android shape: the example prebuilds with the kit's config plugin and
  # assembles with its Kotlin, then StatusRules' JVM tests run. The emulator proof is recorded in the PR (BK-S1).
  statusbar-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/expo/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: CI=1 npx expo prebuild -p android --no-install && (cd android && ./gradlew assembleDebug :byokit-statusbar:testDebugUnitTest)
        working-directory: examples/expo

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: examples/expo
