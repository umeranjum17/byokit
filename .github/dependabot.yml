version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /
      - /examples/expo
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Internal packages are versioned and cascaded together by release.ts.
    ignore:
      - dependency-name: '@byokit/*'
      # The engine pin moves these packages together; lone bumps cannot pass.
      - dependency-name: '@openclaw/*'
      # An Expo SDK moves expo, its expo-* modules, react-native and the native template together
      # (`npx expo install expo@^N --fix`); a lone major bump of any of them cannot build.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      # No filters: every npm update lands in one PR so a dependabot burst
      # cannot hold the shared runner pool during a release.
      npm:
